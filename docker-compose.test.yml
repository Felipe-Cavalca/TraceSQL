# Bancos descartáveis para os testes de integração (go test -tags integration ./...).
# Uso: docker compose -f docker-compose.test.yml up -d --wait
# Portas altas para não colidir com bancos locais. Credenciais só de teste.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tracesql
      POSTGRES_PASSWORD: tracesql
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracesql"]
      interval: 3s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: tracesql
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptracesql --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
